# This file declaratively defines the Talos cluster topology.
# Non-secret cluster and node parameters. Talos secrets are stored in talsecret.sops.yaml.

clusterName: n4mlz-cluster
talosVersion: v1.14.4
kubernetesVersion: v1.34.1
endpoint: https://10.240.30.1:6443

additionalApiServerCertSans:
  - 10.240.30.1
  - 10.240.30.2
  - 10.240.30.3

cniConfig:
  name: none

controlPlane:
  patches:
    - "@./patches/kube-proxy.yaml"

worker:
  patches:
    - "@./patches/kube-proxy.yaml"
    - "@./patches/longhorn-data-path.yaml"
  userVolumes:
    - name: persistent-volume
      provisioning:
        diskSelector:
          match: disk.symlinks.exists(s, s.contains('-pv-0'))
        minSize: 200GiB
      filesystem:
        type: xfs

nodes:
  - hostname: cp-01
    controlPlane: true
    ipAddress: 10.240.30.1
    installDisk: /dev/sda
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
    networkInterfaces:
      - interface: eth0
        addresses:
          - 10.240.30.1/16
        routes:
          - network: 0.0.0.0/0
            gateway: 10.240.255.254

  - hostname: cp-02
    controlPlane: true
    ipAddress: 10.240.30.2
    installDisk: /dev/sda
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
    networkInterfaces:
      - interface: eth0
        addresses:
          - 10.240.30.2/16
        routes:
          - network: 0.0.0.0/0
            gateway: 10.240.255.254

  - hostname: cp-03
    controlPlane: true
    ipAddress: 10.240.30.3
    installDisk: /dev/sda
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
    networkInterfaces:
      - interface: eth0
        addresses:
          - 10.240.30.3/16
        routes:
          - network: 0.0.0.0/0
            gateway: 10.240.255.254

  - hostname: wk-01
    controlPlane: false
    ipAddress: 10.240.30.4
    installDisk: /dev/sda
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
    patches:
      - "@./patches/addressless-public-vlan.yaml"
      - "@./patches/public-gateway-node-label.yaml"
    networkInterfaces:
      - interface: eth0
        addresses:
          - 10.240.30.4/16
        routes:
          - network: 0.0.0.0/0
            gateway: 10.240.255.254
      - interface: eth1
        dhcp: false

  - hostname: wk-02
    controlPlane: false
    ipAddress: 10.240.30.5
    installDisk: /dev/sda
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
    patches:
      - "@./patches/addressless-public-vlan.yaml"
      - "@./patches/public-gateway-node-label.yaml"
    networkInterfaces:
      - interface: eth0
        addresses:
          - 10.240.30.5/16
        routes:
          - network: 0.0.0.0/0
            gateway: 10.240.255.254
      - interface: eth1
        dhcp: false

  - hostname: wk-03
    controlPlane: false
    ipAddress: 10.240.30.6
    installDisk: /dev/sda
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
    patches:
      - "@./patches/addressless-public-vlan.yaml"
      - "@./patches/public-gateway-node-label.yaml"
    networkInterfaces:
      - interface: eth0
        addresses:
          - 10.240.30.6/16
        routes:
          - network: 0.0.0.0/0
            gateway: 10.240.255.254
      - interface: eth1
        dhcp: false

  - hostname: wk-04
    controlPlane: false
    ipAddress: 10.240.30.7
    installDisk: /dev/sda
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
