# This workflow requests auto-merge after the image update PR workflow succeeds.

name: Flux image update auto-merge

on:
  workflow_run:
    workflows:
      - Flux image update PR
    types:
      - completed
    branches:
      - "flux-image-updates/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for the image update PR
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pull_request_url="$(gh pr list \
            --repo "$GH_REPO" \
            --base main \
            --head "$UPDATE_BRANCH" \
            --json url \
            --jq '.[0].url // empty')"

          if [ -z "$pull_request_url" ]; then
            exit 0
          fi

          gh pr merge "$pull_request_url" --repo "$GH_REPO" --auto --squash
