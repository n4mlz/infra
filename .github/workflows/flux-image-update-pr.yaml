# This workflow opens or updates a pull request for each Flux image update branch.

name: Flux image update PR

on:
  push:
    branches:
      - "flux-image-updates/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: flux-image-update-pr-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update pull request and enable auto-merge
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ github.ref_name }}
        run: |
          service="${UPDATE_BRANCH#flux-image-updates/}"
          if [ "$service" = "$UPDATE_BRANCH" ]; then
            exit 1
          fi

          pull_request_url="$(gh pr list \
            --repo "$GH_REPO" \
            --base main \
            --head "$UPDATE_BRANCH" \
            --json url \
            --jq '.[0].url // empty')"

          if [ -z "$pull_request_url" ]; then
            pull_request_url="$(gh pr create \
              --repo "$GH_REPO" \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "chore: update ${service} images" \
              --body "Flux detected updated container image digests for ${service}. This pull request follows the service-specific Flux image update branch.")"
          fi

          gh pr merge "$pull_request_url" --repo "$GH_REPO" --auto --squash
