# This file configures the Flux installation and image automation behavior.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: image-automation-controller
    namespace: flux-system
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --feature-gates=GitAllBranchReferences=false
