# This ExternalSecret provides OAuth credentials to the Tailscale Kubernetes Operator.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: "Tailscale Kubernetes Operator/client_id"
    - secretKey: client_secret
      remoteRef:
        key: "Tailscale Kubernetes Operator/client_secret"
