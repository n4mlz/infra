# This Deployment serves the XLAIR staging API.

apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: xlair-staging
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: xlair-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/xlair-dev/xlair-api:latest@sha256:5a841831164521df3fc4335c9a6b48f0070cd08093b786b338f1b968598a3655 # {"$imagepolicy": "flux-system:xlair-staging-api"}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: database-config
            - configMapRef:
                name: api-config
            - secretRef:
                name: database-credentials
            - secretRef:
                name: api-credentials
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
