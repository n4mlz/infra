# This Deployment serves the XLAIR staging dashboard.

apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: xlair-staging
spec:
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: xlair-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 65533
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ghcr.io/xlair-dev/dashboard:latest@sha256:4bc0995237de9699178e63a2eabc3760ff6b080cb8ccaaed5f6ba8342efee224 # {"$imagepolicy": "flux-system:xlair-staging-dashboard"}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: dashboard-config
            - secretRef:
                name: dashboard-credentials
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
