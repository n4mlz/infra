# These ExternalSecrets materialize XLAIR staging credentials from 1Password.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: xlair-staging
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: "XLAIR Staging/database_user"
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "XLAIR Staging/database_password"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-credentials
  namespace: xlair-staging
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  data:
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef:
        key: "XLAIR Staging/r2_access_key_id"
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef:
        key: "XLAIR Staging/r2_secret_access_key"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashboard-credentials
  namespace: xlair-staging
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  data:
    - secretKey: AUTH0_CLIENT_SECRET
      remoteRef:
        key: "XLAIR Staging/dashboard_auth0_client_secret"
    - secretKey: AUTH0_SECRET
      remoteRef:
        key: "XLAIR Staging/dashboard_auth0_secret"
