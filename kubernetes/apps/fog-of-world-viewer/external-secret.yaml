# This ExternalSecret supplies the Dropbox rclone configuration from 1Password.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fog-of-world-viewer-credentials
  namespace: fog-of-world-viewer
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  data:
    - secretKey: rclone.conf
      remoteRef:
        key: "Fog of World Viewer/RCLONE_CONFIG"
