# This Deployment serves Fog of World data over the tailnet without modifying the source volume.
# Flux substitutes the Tailscale hostname from the app-hostnames ConfigMap.

apiVersion: v1
kind: Service
metadata:
  name: viewer
  namespace: fog-of-world-viewer
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: ${FOG_VIEWER_TAILNET_HOSTNAME}
spec:
  selector:
    app.kubernetes.io/name: fog-of-world-viewer
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: viewer
  namespace: fog-of-world-viewer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fog-of-world-viewer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fog-of-world-viewer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: viewer
          image: ghcr.io/n4mlz/fog_of_world_viewer@sha256:6568b9ade70ff6b396e49d3f3f312d7122abf5c466a8cd36d984bb2cd2590cec
          envFrom:
            - configMapRef:
                name: viewer-config
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
