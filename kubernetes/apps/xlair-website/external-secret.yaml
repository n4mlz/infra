# This ExternalSecret materializes the XLAIR website M2M credential from 1Password.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: website-credentials
  namespace: xlair-website
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  data:
    - secretKey: AUTH0_M2M_CLIENT_SECRET
      remoteRef:
        key: "XLAIR Website/auth0_m2m_client_secret"
