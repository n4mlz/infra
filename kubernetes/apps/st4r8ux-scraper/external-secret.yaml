# This ExternalSecret supplies the Discord webhook from 1Password.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scraper-credentials
  namespace: st4r8ux-scraper
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  data:
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: "st4r8ux Job Scraper/DISCORD_WEBHOOK_URL"
