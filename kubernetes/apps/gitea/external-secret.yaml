# This ExternalSecret materializes Gitea credentials from 1Password.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-credentials
  namespace: gitea
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "Gitea/password"
    - secretKey: GITEA__database__PASSWD
      remoteRef:
        key: "Gitea/password"
    - secretKey: GITEA__security__INTERNAL_TOKEN
      remoteRef:
        key: "Gitea/internal_token"
    - secretKey: GITEA__server__LFS_JWT_SECRET
      remoteRef:
        key: "Gitea/lfs_jwt_secret"
    - secretKey: GITEA__oauth2__JWT_SECRET
      remoteRef:
        key: "Gitea/oauth2_jwt_secret"
