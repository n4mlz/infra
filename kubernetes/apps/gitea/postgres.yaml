# This StatefulSet stores Gitea's PostgreSQL database on Longhorn.
# The official entrypoint starts as root to prepare the data directory, then drops to postgres.

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: gitea
spec:
  selector:
    app.kubernetes.io/name: gitea-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: gitea
spec:
  serviceName: postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres@sha256:c9fcaef49a1ca7deae24437c705bf7485922f8a768a140006c5d8abb3f6cac7b
          ports:
            - name: postgresql
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-credentials
                  key: POSTGRES_PASSWORD
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - gitea
                - -d
                - gitea
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - gitea
                - -d
                - gitea
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - gitea
                - -d
                - gitea
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
