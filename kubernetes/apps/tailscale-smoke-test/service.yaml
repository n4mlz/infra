# This service exposes the smoke test to the tailnet through Tailscale Operator.
# Flux substitutes the Tailscale hostname from the app-hostnames ConfigMap.

apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: tailscale-smoke-test
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: ${TAILSCALE_SMOKE_TEST_HOSTNAME}
spec:
  selector:
    app.kubernetes.io/name: tailscale-smoke-test
  ports:
    - name: http
      port: 80
      targetPort: http
