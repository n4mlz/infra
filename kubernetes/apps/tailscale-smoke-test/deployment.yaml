# This deployment serves a marker stored on the persistent volume.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: tailscale-smoke-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tailscale-smoke-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailscale-smoke-test
    spec:
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-data
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - test -f /data/index.html || printf '%s\n' 'Tailscale and persistent volume smoke test' > /data/index.html
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: webserver
          image: busybox:1.36.1
          command:
            - httpd
            - -f
            - -p
            - "8080"
            - -h
            - /data
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
