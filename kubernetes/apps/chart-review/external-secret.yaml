# This ExternalSecret materializes the chart review M2M credential from 1Password.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chart-review-credentials
  namespace: chart-review
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  data:
    - secretKey: AUTH0_CLIENT_SECRET
      remoteRef:
        key: "XLAIR Chart Review/auth0_client_secret"
