# This Deployment serves the chart review application and mounts its persistent data.

apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: chart-review
spec:
  selector:
    app.kubernetes.io/name: chart-review
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: chart-review
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chart-review
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chart-review
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chart-review
          image: ghcr.io/xlair-dev/chart-review:latest@sha256:69356e45a7a3d9114e4de4935a653c64d8bdf1b2cd00a860baaef659b4dfa730 # {"$imagepolicy": "flux-system:chart-review"}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: chart-review-config
            - secretRef:
                name: chart-review-credentials
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: chart-review
spec:
  parentRefs:
    - name: public-gateway
      namespace: platform
      sectionName: https-xlair-subdomains
  hostnames:
    - review.xlair.dev
  rules:
    - backendRefs:
        - name: web
          port: 80
