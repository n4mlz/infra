# This Deployment serves Task Platform's web and MCP endpoints.

apiVersion: v1
kind: Service
metadata:
  name: task-platform
  namespace: task-platform
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: infra-task-platform
spec:
  selector:
    app.kubernetes.io/name: task-platform
  ports:
    - name: web
      port: 20003
      targetPort: web
    - name: mcp
      port: 20004
      targetPort: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-platform
  namespace: task-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: task-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: task-platform
          image: ghcr.io/n4mlz/tasks@sha256:d5f54f678ff00110061a862cd1392d6247522493806aca1109d76b2917b08ddc
          ports:
            - name: web
              containerPort: 20003
            - name: mcp
              containerPort: 20004
          envFrom:
            - configMapRef:
                name: task-platform-config
            - secretRef:
                name: task-platform-credentials
          startupProbe:
            tcpSocket:
              port: web
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: web
          livenessProbe:
            tcpSocket:
              port: web
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
