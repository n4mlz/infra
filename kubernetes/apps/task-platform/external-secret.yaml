# This ExternalSecret materializes the Task Platform LLM credential from 1Password.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: task-platform-credentials
  namespace: task-platform
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  data:
    - secretKey: TASK_PLATFORM_LLM_API_KEY
      remoteRef:
        key: "Task Platform/llm_api_key"
