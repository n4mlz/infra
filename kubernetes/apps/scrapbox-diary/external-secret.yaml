# This ExternalSecret supplies Scrapbox access and site metadata from 1Password.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scrapbox-diary-credentials
  namespace: scrapbox-diary
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  data:
    - secretKey: PROJECT_NAME
      remoteRef:
        key: "Scrapbox Diary/PROJECT_NAME"
    - secretKey: PAGE_TITLE
      remoteRef:
        key: "Scrapbox Diary/PAGE_TITLE"
    - secretKey: CONNECT_SID
      remoteRef:
        key: "Scrapbox Diary/CONNECT_SID"
