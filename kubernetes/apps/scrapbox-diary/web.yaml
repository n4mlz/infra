# This Deployment serves generated pages publicly through the shared Gateway.

apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: scrapbox-diary
spec:
  selector:
    app.kubernetes.io/name: scrapbox-diary
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: scrapbox-diary
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: scrapbox-diary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scrapbox-diary
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: site
          persistentVolumeClaim:
            claimName: site
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: scrapbox-diary
spec:
  parentRefs:
    - name: public-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - diary.n4mlz.dev
  rules:
    - backendRefs:
        - name: web
          port: 80
